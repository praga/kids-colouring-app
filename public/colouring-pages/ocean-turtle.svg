<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none">
  <rect width="800" height="1000" fill="#FFFFFF"/>
  <!-- Bubbles floating up -->
  <g stroke="#1F2937" stroke-width="6" fill="#FFFFFF">
    <circle cx="200" cy="180" r="25"/>
    <circle cx="170" cy="240" r="15"/>
    <circle cx="215" cy="275" r="10"/>
    <circle cx="620" cy="140" r="30"/>
    <circle cx="650" cy="220" r="18"/>
    <circle cx="590" cy="260" r="12"/>
    <circle cx="340" cy="110" r="20"/>
  </g>

  <!-- Friendly Starfish on Coral -->
  <g stroke="#1F2937" stroke-width="7" stroke-linejoin="round" fill="#FFFFFF">
    <polygon points="680,800 705,830 740,830 715,855 725,890 685,875 650,895 655,855 630,835 665,830"/>
    <circle cx="675" cy="850" r="4" fill="#1F2937"/>
    <circle cx="695" cy="850" r="4" fill="#1F2937"/>
    <path d="M 680 862 Q 685 867 690 862" fill="none" stroke-width="4"/>
  </g>

  <!-- Sea Bottom with Seaweed and Coral Reef -->
  <g stroke="#1F2937" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF">
    <!-- Sandy Sea Floor -->
    <path d="M 20 900 Q 400 870 780 900 L 780 980 L 20 980 Z"/>

    <!-- Coral Branches Left -->
    <path d="M 60 900 C 60 820 110 780 90 730 C 70 780 30 820 40 900 Z"/>
    <path d="M 90 730 C 120 710 150 760 140 820 C 130 860 100 880 90 900"/>
    <path d="M 140 820 C 180 800 200 850 180 900"/>

    <!-- Seaweed Right -->
    <path d="M 720 900 Q 750 750 710 650 Q 750 760 740 900"/>
    <path d="M 750 900 Q 780 800 760 720 Q 790 810 770 900"/>
  </g>

  <!-- Little Tropical Fish Swimmer -->
  <g stroke="#1F2937" stroke-width="6" stroke-linecap="round" fill="#FFFFFF">
    <path d="M 120 380 C 160 350 220 370 240 400 C 220 430 160 450 120 420 Z"/>
    <polygon points="120,400 80,360 80,440"/>
    <circle cx="215" cy="390" r="5" fill="#1F2937"/>
    <path d="M 190 375 C 180 400 180 415 190 425" fill="none"/>
  </g>

  <!-- Big Happy Swimming Sea Turtle in Center -->
  <g stroke="#1F2937" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF">
    <!-- Large Round Shell -->
    <ellipse cx="400" cy="520" rx="170" ry="140"/>

    <!-- Turtle Shell Hexagon Pattern -->
    <polygon points="400,430 460,465 460,535 400,570 340,535 340,465"/>
    <!-- Outer Shell Pattern Lines -->
    <line x1="400" y1="430" x2="400" y2="380" stroke-width="7"/>
    <line x1="460" y1="465" x2="520" y2="430" stroke-width="7"/>
    <line x1="460" y1="535" x2="530" y2="560" stroke-width="7"/>
    <line x1="400" y1="570" x2="400" y2="660" stroke-width="7"/>
    <line x1="340" y1="535" x2="270" y2="560" stroke-width="7"/>
    <line x1="340" y1="465" x2="280" y2="430" stroke-width="7"/>

    <!-- Front Left Flipper (Swimming forward) -->
    <path d="M 270 440 C 210 380 110 350 80 400 C 60 440 120 500 240 490 Z"/>
    
    <!-- Front Right Flipper -->
    <path d="M 530 440 C 590 380 690 350 720 400 C 740 440 680 500 560 490 Z"/>

    <!-- Back Left Flipper -->
    <path d="M 280 600 C 240 650 210 710 240 730 C 265 745 300 700 320 635 Z"/>

    <!-- Back Right Flipper -->
    <path d="M 520 600 C 560 650 590 710 560 730 C 535 745 500 700 480 635 Z"/>

    <!-- Cute Turtle Tail -->
    <polygon points="385,655 400,705 415,655"/>

    <!-- Turtle Neck and Big Cute Smiling Head -->
    <path d="M 370 390 C 370 320 340 260 400 240 C 460 260 430 320 430 390 Z"/>
    
    <!-- Turtle Head -->
    <ellipse cx="400" cy="275" rx="55" ry="45"/>

    <!-- Big Cheerful Turtle Eyes -->
    <ellipse cx="375" cy="265" rx="12" ry="16" fill="#1F2937"/>
    <circle cx="380" cy="258" r="5" fill="#FFFFFF"/>
    <ellipse cx="425" cy="265" rx="12" ry="16" fill="#1F2937"/>
    <circle cx="430" cy="258" r="5" fill="#FFFFFF"/>

    <!-- Big Happy Turtle Smile -->
    <path d="M 380 295 Q 400 312 420 295" fill="none" stroke-width="6"/>

    <!-- Rosy Cheek Blushes -->
    <ellipse cx="360" cy="285" rx="9" ry="6" fill="#FFF0F5" stroke="#E5E7EB" stroke-dasharray="3 3"/>
    <ellipse cx="440" cy="285" rx="9" ry="6" fill="#FFF0F5" stroke="#E5E7EB" stroke-dasharray="3 3"/>
  </g>
</svg>
