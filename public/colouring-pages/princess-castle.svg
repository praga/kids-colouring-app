<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none">
  <rect width="800" height="1000" fill="#FFFFFF"/>
  <!-- Fairytale Castle in Background -->
  <g stroke="#1F2937" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF">
    <!-- Castle Wall Base -->
    <rect x="420" y="320" width="300" height="260"/>
    <path d="M 420 320 L 420 280 L 450 280 L 450 320 L 480 320 L 480 280 L 510 280 L 510 320 L 540 320 L 540 280 L 570 280 L 570 320 L 600 320 L 600 280 L 630 280 L 630 320 L 660 320 L 660 280 L 690 280 L 690 320 L 720 320 L 720 280"/>
    
    <!-- Central High Tower -->
    <rect x="520" y="180" width="100" height="140"/>
    <polygon points="510,180 570,80 630,180"/>
    <!-- Flag on Castle -->
    <line x1="570" y1="80" x2="570" y2="40"/>
    <polygon points="570,40 620,55 570,70"/>

    <!-- Left Spire Tower -->
    <rect x="400" y="240" width="70" height="140"/>
    <polygon points="390,240 435,160 480,240"/>
    <!-- Right Spire Tower -->
    <rect x="670" y="240" width="70" height="140"/>
    <polygon points="660,240 705,160 750,240"/>

    <!-- Castle Arch Gate & Windows -->
    <path d="M 535 580 L 535 480 C 535 440 605 440 605 480 L 605 580 Z"/>
    <path d="M 555 240 C 555 220 585 220 585 240 L 585 270 L 555 270 Z"/>
  </g>

  <!-- Princess in Foreground -->
  <g stroke="#1F2937" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF">
    <!-- Ballgown Dress -->
    <path d="M 270 560 C 270 650 120 780 140 920 C 220 950 360 950 440 920 C 460 780 310 650 310 560 Z"/>
    <!-- Dress Ribbon & Ruffles -->
    <path d="M 140 920 Q 290 880 440 920" fill="none" stroke-width="6"/>
    <path d="M 210 680 C 190 750 170 820 160 900" fill="none" stroke-width="6"/>
    <path d="M 370 680 C 390 750 410 820 420 900" fill="none" stroke-width="6"/>
    
    <!-- Bodice -->
    <path d="M 260 460 L 255 560 L 325 560 L 320 460 Z"/>
    <!-- Cute Waist Bow -->
    <circle cx="290" cy="560" r="14" fill="#FFFFFF"/>
    <path d="M 276 560 C 250 540 240 580 276 565 Z"/>
    <path d="M 304 560 C 330 540 340 580 304 565 Z"/>

    <!-- Princess Head & Hair -->
    <path d="M 240 320 C 220 400 230 460 250 500 C 265 470 270 450 260 430"/>
    <path d="M 340 320 C 360 400 350 460 330 500 C 315 470 310 450 320 430"/>

    <circle cx="290" cy="380" r="55"/>

    <!-- Princess Face -->
    <ellipse cx="270" cy="375" rx="9" ry="12" fill="#1F2937"/>
    <circle cx="273" cy="371" r="3" fill="#FFFFFF"/>
    <ellipse cx="310" cy="375" rx="9" ry="12" fill="#1F2937"/>
    <circle cx="313" cy="371" r="3" fill="#FFFFFF"/>

    <!-- Eyelashes -->
    <path d="M 262 365 L 255 358 M 278 365 L 285 358" stroke-width="5"/>
    <path d="M 302 365 L 295 358 M 318 365 L 325 358" stroke-width="5"/>

    <!-- Sweet Smile & Cheeks -->
    <path d="M 280 405 Q 290 418 300 405" fill="none" stroke-width="6"/>
    <ellipse cx="260" cy="400" rx="9" ry="6" fill="#FFF0F5" stroke="#E5E7EB" stroke-dasharray="3 3"/>
    <ellipse cx="320" cy="400" rx="9" ry="6" fill="#FFF0F5" stroke="#E5E7EB" stroke-dasharray="3 3"/>

    <!-- Princess Tiara / Crown with Jewels -->
    <path d="M 255 330 L 260 290 L 275 310 L 290 280 L 305 310 L 320 290 L 325 330 Z"/>
    <circle cx="290" cy="280" r="5" fill="#1F2937"/>
    <circle cx="260" cy="290" r="4" fill="#1F2937"/>
    <circle cx="320" cy="290" r="4" fill="#1F2937"/>

    <!-- Arms -->
    <path d="M 255 470 C 220 500 200 520 180 500"/>
    <path d="M 325 470 C 350 490 380 490 410 470"/>

    <!-- Magic Wand in Right Hand -->
    <line x1="400" y1="520" x2="470" y2="380" stroke-width="8"/>
    <!-- Star on tip of wand -->
    <polygon points="470,360 478,375 495,375 482,385 487,402 470,392 453,402 458,385 445,375 462,375" fill="#FFFFFF" stroke-width="6"/>
    <!-- Sparkles bursting from wand -->
    <line x1="495" y1="360" x2="515" y2="350" stroke-width="5"/>
    <line x1="480" y1="340" x2="490" y2="320" stroke-width="5"/>
    <line x1="450" y1="345" x2="435" y2="330" stroke-width="5"/>
  </g>

  <!-- Big Flowers in Garden -->
  <g stroke="#1F2937" stroke-width="7" stroke-linecap="round" fill="#FFFFFF">
    <circle cx="100" cy="850" r="22"/>
    <circle cx="100" cy="815" r="15"/>
    <circle cx="130" cy="835" r="15"/>
    <circle cx="125" cy="870" r="15"/>
    <circle cx="85" cy="880" r="15"/>
    <circle cx="70" cy="840" r="15"/>

    <circle cx="580" cy="880" r="24"/>
    <circle cx="580" cy="840" r="16"/>
    <circle cx="615" cy="865" r="16"/>
    <circle cx="610" cy="905" r="16"/>
    <circle cx="560" cy="915" r="16"/>
    <circle cx="545" cy="870" r="16"/>
  </g>
</svg>
